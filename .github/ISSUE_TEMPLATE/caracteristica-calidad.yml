name: "Característica de calidad"
description: "Registrar una característica de calidad de producto seleccionada (Entrega 2, Paso 1, ítem 2)"
title: "[CAR-XX] "
projects: ["Calidad-Software-UNAL-2026-2/7"]
labels: ["tipo:caracteristica-calidad"]
body:
  - type: markdown
    attributes:
      value: |
        *Este issue es el **padre** de las medidas de esta característica. Después de crear cada medida `[MED-XX]`, ábrela desde aquí en la sección **Sub-issues** → **Add existing issue**.*
        *Recuerda: asigna (Assignees, panel derecho) al integrante responsable de esta característica.*
  - type: dropdown
    id: caracteristica
    attributes:
      label: Característica (ISO/IEC 25010:2011)
      description: Selecciona la característica de calidad de producto que registra este issue.
      options:
        - Adecuación funcional
        - Eficiencia de desempeño
        - Compatibilidad
        - Usabilidad
        - Fiabilidad
        - Seguridad
        - Mantenibilidad
        - Portabilidad
    validations:
      required: true
  - type: textarea
    id: definicion
    attributes:
      label: Definición adaptada al dominio
      description: ¿Qué significa esta característica en tu proyecto, con sus actores y su contexto?
      placeholder: "Ej: Para GeoMap, la eficiencia de desempeño es la capacidad de mostrar y desplazar mapas con varias capas sin demoras perceptibles para el usuario final, incluso desde un celular con conexión móvil."
    validations:
      required: true
  - type: textarea
    id: motivacion
    attributes:
      label: Necesidades o RNF que la motivan
      description: |
        Enlaza los RNF escribiendo su número con # (por ejemplo, #14) y describe las necesidades implícitas que identificaron.
        Ojo: en la Entrega 1 el formulario de RNF usaba nombres como "Rendimiento / Eficiencia" o "Disponibilidad / Fiabilidad". Ubica cada RNF en la característica de la norma que corresponda (por ejemplo, "Disponibilidad / Fiabilidad" → Fiabilidad).
      placeholder: "Ej: #14 (tiempo de carga del mapa) y #17 (consumo de datos móviles). Necesidad implícita: el usuario consulta el mapa en campo, con señal intermitente."
    validations:
      required: true
